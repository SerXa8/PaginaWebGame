<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant Lineups</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #ff0000;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        main {
            padding: 20px;
        }
        h1, h2 {
            color: #0000ff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background-color: #ffffff;
            color: #000000;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
        .card h2 {
            color: #ff0000;
        }
        .card p {
            color: #666666;
        }
    </style>
</head>
<body>
    <header>
        <h1>Valorant Lineups</h1>
    </header>
    <main>
        <div class="container">
            <div class="card">
                <h2>Lineup 1</h2>
                <p>Descripción de la primera lineup...</p>
            </div>
            <div class="card">
                <h2>Lineup 2</h2>
                <p>Descripción de la segunda lineup...</p>
            </div>
            <!-- Agregar más lineups según sea necesario -->
        </div>
    </main>
</body>
</html>
