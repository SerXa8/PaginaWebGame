<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro de Mapas</title>
    <style>
        .map-competitive {
            color: gold;
        }
    </style>
</head>
<body>
    <p>Archivo nuevo</p>
    <div id="map-filter">
        <ul>
            <!-- Mapas en modo competitivo -->
            <li class="map-competitive">abbys</li>
            <li class="map-competitive">pearl</li>
            <li class="map-competitive">corrode</li>
            <li class="map-competitive">summit</li>
            <li class="map-competitive">split</li>
            <!-- Mapas no en modo competitivo -->
            <li>map1</li>
            <li>map2</li>
            <li>map3</li>
        </ul>
    </div>
    <script>
        // Asegurarse de que los mapas competitivos estén al principio
        const mapFilter = document.getElementById('map-filter');
        const competitiveMaps = Array.from(mapFilter.querySelectorAll('.map-competitive'));
        const nonCompetitiveMaps = Array.from(mapFilter.querySelectorAll('li:not(.map-competitive)'));
        
        // Vaciar la lista y agregar los mapas competitivos al principio
        mapFilter.innerHTML = '';
        competitiveMaps.forEach(map => mapFilter.appendChild(map));
        nonCompetitiveMaps.forEach(map => mapFilter.appendChild(map));
    </script>
</body>
</html>
