name: Actualizar estado de Twitch

on:
  schedule:
    - cron: '*/5 * * * *' # Se ejecuta cada 5 minutos
  workflow_dispatch: # Permite probarlo manualmente

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Consultar API de Twitch
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          # 1. Obtener Token de Twitch
          TOKEN=$(curl -s -X POST "https://id.twitch.tv/oauth2/token" \
            -d "client_id=$TWITCH_CLIENT_ID&client_secret=$TWITCH_CLIENT_SECRET&grant_type=client_credentials" | jq -r .access_token)

          # 2. Lista de streamers a monitorear (agrega o quita líneas aquí)
          STREAMERS=(
            "javierrlol"
            "s3rxa8"
          )

          # 3. Construir la consulta a la API automáticamente
          PARAMS=""
          for streamer in "${STREAMERS[@]}"; do
            PARAMS="${PARAMS}&user_login=${streamer}"
          done

          # 4. Guardar resultado en live.json
          curl -s -H "Client-ID: $TWITCH_CLIENT_ID" \
               -H "Authorization: Bearer $TOKEN" \
               "https://api.twitch.tv/helix/streams?${PARAMS#&}" > live.json

      - name: Guardar cambios
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add live.json
          git commit -m "Auto-update live streamers" || exit 0
          git push
