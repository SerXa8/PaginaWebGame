<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo Valorant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: linear-gradient(135deg, #ff7700, #ff0000);
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background: #ff0000;
            color: #fff;
            padding: 10px 0;
            text-align: center;
            position: relative;
        }
        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff7700, #ff0000);
            opacity: 0.5;
            z-index: -1;
        }
        nav {
            display: flex;
            justify-content: space-around;
            background: #ff7700;
            padding: 10px 0;
            position: relative;
        }
        nav::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff7700, #ff0000);
            opacity: 0.5;
            z-index: -1;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            padding: 10px;
            transition: background 0.3s;
            position: relative;
        }
        nav a::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff7700, #ff0000);
            opacity: 0.5;
            z-index: -1;
        }
        nav a:hover {
            background: #ff0000;
        }
        main {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .card {
            background: #fff;
            padding: 20px;
            margin: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
            animation: fadeIn 1s ease-in-out;
        }
        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            background: #ff7700;
        }
        footer {
            background: #ff0000;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            margin-top: 20px;
            position: relative;
        }
        footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff7700, #ff0000);
            opacity: 0.5;
            z-index: -1;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @media (prefers-reduced-motion: reduce) {
            .card:hover {
                transform: none;
                box-shadow: none;
                background: none;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Torneo Valorant</h1>
    </header>
    <nav>
        <a href="#home">Inicio</a>
        <a href="#about">Acerca de</a>
        <a href="#services">Servicios</a>
        <a href="#contact">Contacto</a>
    </nav>
    <main>
        <div class="card">
            <h2>Card 1</h2>
            <p>Descripción de la tarjeta 1.</p>
        </div>
        <div class="card">
            <h2>Card 2</h2>
            <p>Descripción de la tarjeta 2.</p>
        </div>
    </main>
    <footer>
        <p>&copy; 2023 Torneo Valorant</p>
    </footer>
</body>
</html>
