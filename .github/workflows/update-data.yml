name: Actualizar datos de Riot Games

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Comprobar RIOT_API_KEY
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          if [ -z "$RIOT_API_KEY" ]; then
            echo "::error::Falta el secret RIOT_API_KEY"
            exit 1
          fi

      - name: Ejecutar script de actualización
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: node updateLol.js

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "chore: actualizar datos de LoL"
          git pull --rebase --autostash
          git push
