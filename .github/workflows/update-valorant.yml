name: Actualizar Ranking Valorant

on:
  schedule:
    - cron: '*/10 * * * *' # Se ejecuta cada 10 minutos
  workflow_dispatch:

jobs:
  update-valorant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Ejecutar Script de Valorant
        run: node updateValorant.js

      - name: Guardar cambios
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/valorantData.js
          git commit -m "Auto-update Valorant leaderboard" || exit 0
          git push
