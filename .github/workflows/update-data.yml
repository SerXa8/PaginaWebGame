name: Actualizar datos de Riot Games

on:
  schedule:
    # Se ejecuta automáticamente cada 30 minutos

#┌───────────── minuto (0 - 59)
#│ ┌─────────── hora (0 - 23, en formato UTC)
#│ │ ┌───────── día del mes (1 - 31)
#│ │ │ ┌─────── mes (1 - 12)
#│ │ │ │ ┌───── día de la semana (0 - 6, donde 0 es Domingo)
#│ │ │ │ │
#* * * * *

#El asterisco * significa "cada" o "todos".
#La barra / expresa un intervalo (por ejemplo, */10 = cada 10 unidades).

    
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v3

    - name: Configurar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Ejecutar script de actualización
      env:
        RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      run: node updateData.js

    - name: Guardar cambios en el repositorio
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/lol.js
        git commit -m "bot: actualización automática de datos SoloQ" || exit 0
        git push
