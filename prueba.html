<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Página Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #444;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 1rem;
            transition: background-color 0.3s;
        }
        nav a:hover {
            background-color: #555;
        }
        main {
            padding: 2rem;
            text-align: center;
        }
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 1rem;
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 1000; /* Asegura que el footer esté por encima de otros elementos */
        }
        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Nueva Página Web</h1>
    </header>
    <nav>
        <a href="#home">Inicio</a>
        <a href="#about">Acerca de</a>
        <a href="#contact">Contacto</a>
    </nav>
    <main>
        <section id="home">
            <h2>Bienvenido</h2>
            <p>Esta es una página web nueva y funcional.</p>
        </section>
        <section id="about">
            <h2>Acerca de</h2>
            <p>Información sobre la página web.</p>
        </section>
        <section id="contact">
            <h2>Contacto</h2>
            <p>Información de contacto.</p>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Nueva Página Web</p>
    </footer>
</body>
</html>
