<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant Lineups</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="filters">
            <select id="mapFilter">
                <option value="all">Todos los Mapas</option>
                <!-- Opciones de mapas se añadirán aquí -->
            </select>
            <select id="agentFilter">
                <option value="all">Todos los Agentes</option>
                <!-- Opciones de agentes se añadirán aquí -->
            </select>
            <select id="teamFilter">
                <option value="all">Todos los Bandos</option>
                <option value="terrorists">Terroristas</option>
                <option value="counter-terrorists">Anti-Terroristas</option>
            </select>
        </div>
    </header>
    <main>
        <div id="lineupsGrid">
            <!-- Contenido de los lineups se añadirá aquí -->
        </div>
    </main>
    <script>
        // Asegurarse de que el script no tenga inyecciones de script o exposición de credenciales
        // Ejemplo de código seguro:
        document.getElementById('mapFilter').addEventListener('change', function() {
            console.log('Mapa seleccionado:', this.value);
        });
    </script>
</body>
</html>
