<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo Valorant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .tournament-container {
            width: 80%;
            max-width: 800px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        .team {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #ddd;
            transition: background-color 0.2s ease;
        }
        .team:hover, .team:focus-visible {
            background-color: #f9f9f9;
        }
        .team:last-child {
            border-bottom: none;
        }
        .team-name {
            font-weight: bold;
            color: #333;
        }
        .team-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            transition: transform 0.2s ease;
        }
        .team-logo:hover, .team-logo:focus-visible {
            transform: scale(1.1);
        }
        @media (prefers-reduced-motion: reduce) {
            .team:hover, .team:focus-visible, .team-logo:hover, .team-logo:focus-visible {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <div class="tournament-container">
        <div class="team" style="background-image: url('https://via.placeholder.com/40?text=Team1');">
            <div class="team-name">Equipo 1</div>
