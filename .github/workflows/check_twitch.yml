name: Actualizar estado de Twitch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  update-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consultar API de Twitch
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$TWITCH_CLIENT_ID" ] || [ -z "$TWITCH_CLIENT_SECRET" ]; then
            echo "::error::Faltan los secrets TWITCH_CLIENT_ID / TWITCH_CLIENT_SECRET"
            exit 1
          fi

          TOKEN=$(curl -s -X POST "https://id.twitch.tv/oauth2/token" \
            -d "client_id=$TWITCH_CLIENT_ID" \
            -d "client_secret=$TWITCH_CLIENT_SECRET" \
            -d "grant_type=client_credentials" | jq -r '.access_token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::No se pudo obtener el token de Twitch"
            exit 1
          fi

          STREAMERS=(
            "javierrlol"
            "s3rxa8"
            "maiiser"
            "send0o"
          )

          PARAMS=""
          for streamer in "${STREAMERS[@]}"; do
            PARAMS="${PARAMS}&user_login=${streamer}"
          done

          mkdir -p data
          TMP=$(mktemp)

          curl -sS -f -H "Client-ID: $TWITCH_CLIENT_ID" \
               -H "Authorization: Bearer $TOKEN" \
               "https://api.twitch.tv/helix/streams?${PARAMS#&}" -o "$TMP"

          jq -e '.data' "$TMP" > /dev/null
          mv "$TMP" data/live.json

      - name: Guardar y subir cambios
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/live.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "chore: actualizar directos de Twitch"
          git pull --rebase --autostash
