<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant Lineups</title>
    <style>
        .mapa-rotacion {
            background-color: gold;
            padding: 5px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Filtros de Lineups</h1>
    <section id="filtros">
        <h2>Mapas</h2>
        <div>
            <label><input type="checkbox" name="mapa" value="Bind"> Bind</label>
        </div>
        <div>
            <label><input type="checkbox" name="mapa" value="Split"> Split</label>
        </div>
        <div>
            <label><input type="checkbox" name="mapa" value="Ascent" class="mapa-rotacion"> Ascent</label>
        </div>
        <div>
            <label><input type="checkbox" name="mapa" value="Haven" class="mapa-rotacion"> Haven</label>
        </div>
        <div>
            <label><input type="checkbox" name="mapa" value="Breeze"> Breeze</label>
        </div>
        <div>
            <label><input type="checkbox" name="mapa" value="Icebox"> Icebox</label>
        </div>
        <div>
            <label><input type="checkbox" name="mapa" value="Fracture"> Fracture</label>
        </div>
        <div>
            <label><input type="checkbox" name="mapa" value="Pearl"> Pearl</label>
        </div>
    </section>
</body>
</html>
