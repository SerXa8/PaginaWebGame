<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Directos Valorant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
        .directo {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin: 20px 0;
            padding: 20px;
        }
        .directo h2 {
            margin-top: 0;
        }
        .directo .graficos {
            margin-top: 20px;
        }
        .directo .redes-sociales {
            margin-top: 20px;
        }
        .directo .redes-sociales a {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="directo">
            <h2>Sistema de Directos Valorant</h2>
            <div class="graficos">
                <h3>Gráficos en tiempo real</h3>
                <div id="graficos"></div>
            </div>
            <div class="redes-sociales">
                <h3>Redes Sociales</h3>
                <a href="https://twitter.com/valorant" target="_blank">Twitter</a>
                <a href="https://www.instagram.com/valorant" target="_blank">Instagram</a>
                <a href="https://www.twitch.tv/valorant" target="_blank">Twitch</a>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const graficosDiv = document.getElementById('graficos');
            graficosDiv.innerHTML = '<canvas id="graficoRealTime" width="400" height="200"></canvas>';
            const canvas = document.getElementById('graficoRealTime');
            const ctx = canvas.getContext('2d');

            function actualizarGrafico() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'blue';
                ctx.fillRect(50, 50, 100, 100);
                requestAnimationFrame(actualizarGrafico);
            }
            actualizarGrafico();

            document.querySelectorAll('.redes-sociales a').forEach(link => {
                link.addEventListener('click', function(event) {
                    event.preventDefault();
                    const url = this.getAttribute('href');
                    window.open(url, '_blank');
                });
            });
        });
    </script>
</body>
</html>
