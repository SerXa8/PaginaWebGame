<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo Valorant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background: #333;
            color: #fff;
            padding: 10px 0;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: space-around;
            background: #444;
            padding: 10px 0;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            padding: 10px;
            transition: background 0.3s;
        }
        nav a:hover {
            background: #555;
        }
        main {
            margin-top: 20px;
        }
        .card {
            background: #f4f4f4;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            margin-top: 20px;
        }
        @media (prefers-reduced-motion: reduce) {
            .card:hover {
                transform: none;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Torneo Valorant</h1>
    </header>
    <nav>
        <a href="#home">Inicio</a>
        <a href="#about">Acerca de</a>
        <a href="#rules">Reglas</a>
        <a href="#contact">Contacto</a>
    </nav>
    <main>
        <div class="card" id="home">
            <h2>Inicio</h2>
            <p>Bienvenido al torneo de Valorant.</p>
        </div>
        <div class="card" id="about">
            <h2>Acerca de</h2>
            <p>Información sobre el torneo de Valorant.</p>
        </div>
        <div class="card" id="rules">
            <h2>Reglas</h2>
            <p>Reglas y condiciones del torneo.</p>
        </div>
        <div class="card" id="contact">
            <h2>Contacto</h2>
            <p>Contáctanos para más información.</p>
        </div>
    </main>
    <footer>
        <p>&copy; 2023 Torneo Valorant</p>
    </footer>
</body>
</html>
