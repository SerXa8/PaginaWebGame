name: Actualizar datos de Deadlock

on:
  schedule:
    - cron: '0 6 * * 1' # Cada lunes a las 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  update-deadlock:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generar snapshots de Deadlock
        run: node updateDeadlock.js

      - name: Guardar cambios
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/deadlockHeroesData.js data/deadlockItemsData.js
          if git diff --staged --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "chore: actualizar datos de Deadlock"
          git pull --rebase --autostash
          git push
