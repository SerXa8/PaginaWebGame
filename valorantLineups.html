<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant Lineups</title>
    <style>
        .map-competitive {
            background-color: gold;
        }
    </style>
</head>
<body>
    <h1>Filtro de Mapas</h1>
    <div id="map-filter">
        <label for="map-select">Selecciona un mapa:</label>
        <select id="map-select">
            <option value="bind" class="map-competitive">Bind</option>
            <option value="ascent" class="map-competitive">Ascent</option>
            <option value="split" class="map-competitive">Split</option>
            <option value="pearl">Pearl</option>
            <option value="haven">Haven</option>
            <option value="abbys">Abbys</option>
            <option value="corrode">Corrode</option>
            <option value="summit">Summit</option>
        </select>
    </div>
</body>
</html>
